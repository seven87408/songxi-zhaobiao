<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--primary:#1a5276;--primary-light:#d4e6f1;--accent:#c0392b;--accent2:#e74c3c;--bg:#f8f9fa;--white:#fff;--text:#2c3e50;--text-light:#7f8c8d;--border:#dce1e5;--shadow:0 2px 12px rgba(0,0,0,.08);--radius:6px}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.6}
.container{max-width:1200px;margin:0 auto;padding:20px 16px}

/* Header */
.header{background:linear-gradient(135deg,var(--primary) 0%,#2980b9 100%);color:#fff;padding:28px 0;margin-bottom:24px;border-radius:0 0 20px 20px;box-shadow:0 4px 20px rgba(26,82,118,.25)}
.header-inner{max-width:1200px;margin:0 auto;padding:0 16px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.header h1{font-size:22px;font-weight:700;display:flex;align-items:center;gap:10px}
.header h1 .icon{width:36px;height:36px;background:rgba(255,255,255,.2);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px}
.header .meta{font-size:13px;opacity:.85;text-align:right}
.header .meta span{display:block}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:24px}
.stat-card{background:var(--white);border-radius:var(--radius);padding:16px;border:1px solid var(--border);text-align:center;transition:transform .15s,box-shadow .15s}
.stat-card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.stat-val{font-size:28px;font-weight:700;color:var(--primary)}
.stat-val.red{color:var(--accent)}
.stat-val.green{color:#27ae60}
.stat-val.orange{color:#e67e22}
.stat-val.blue{color:#2980b9}
.stat-val.purple{color:#8e44ad}
.stat-val.teal{color:#1abc9c}
.stat-label{font-size:12px;color:var(--text-light);margin-top:2px}

/* Filter Bar */
.filter-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.filter-btn{border:1px solid var(--border);background:var(--white);padding:5px 14px;border-radius:20px;font-size:12px;cursor:pointer;transition:all .15s;color:var(--text)}
.filter-btn:hover,.filter-btn.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.search-input{border:1px solid var(--border);border-radius:20px;padding:6px 14px;font-size:12px;outline:none;width:200px;transition:border-color .15s}
.search-input:focus{border-color:var(--primary)}
.filter-bar .spacer{flex:1}

/* Table */
.table-wrap{background:var(--white);border-radius:var(--radius);border:1px solid var(--border);overflow:hidden;box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse}
thead th{background:var(--primary);color:#fff;font-size:12px;font-weight:600;padding:10px 12px;text-align:left;white-space:nowrap;position:sticky;top:0;z-index:1}
thead th:first-child{border-radius:0}
tbody td{padding:10px 12px;font-size:13px;border-bottom:1px solid var(--border);vertical-align:top}
tbody tr:hover{background:#f0f6fb}
.project-name{font-weight:600;color:var(--primary);cursor:pointer;max-width:320px;display:block;line-height:1.4}
.project-name:hover{text-decoration:underline}
.badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:600;white-space:nowrap}
.badge-zb{background:#eaf2e3;color:#27ae60}
.badge-zbgs{background:#fef5e7;color:#e67e22}
.badge-zbtg{background:#d4e6f1;color:#1a5276}
.badge-lb{background:#fbeee6;color:#c0392b}
.badge-cs{background:#f5eef8;color:#8e44ad}
.badge-ht{background:#e8f8f5;color:#1abc9c}
.badge-bg{background:#fff3cd;color:#856404}
.tag-type{display:inline-block;padding:1px 6px;border-radius:3px;font-size:10px;font-weight:500;margin-left:4px}
.tag-type.gc{background:#eaf2e3;color:#27ae60}
.tag-type.zf{background:#d4e6f1;color:#1a5276}
.tag-type.qt{background:#f5eef8;color:#8e44ad}

/* Expandable detail row */
.detail-row{display:none}
.detail-row.open{display:table-row}
.detail-cell{padding:12px 16px;background:#fafbfc;border-bottom:1px solid var(--border)}
.detail-content{max-width:800px;font-size:12px;color:var(--text-light);line-height:1.8}
.detail-content strong{color:var(--text);font-weight:600}
.detail-content a{color:var(--primary);text-decoration:none}
.detail-content a:hover{text-decoration:underline}

/* Footer */
.footer{text-align:center;padding:20px;font-size:12px;color:var(--text-light);margin-top:32px}
.footer a{color:var(--primary);text-decoration:none}

/* Responsive */
@media(max-width:768px){
  .header-inner{flex-direction:column;text-align:center}
  .header .meta{text-align:center}
  .stats{grid-template-columns:repeat(2,1fr)}
  .search-input{width:100%}
  .filter-bar{flex-direction:column}
  table{font-size:12px}
  thead th,tbody td{padding:6px 8px}
  .project-name{max-width:180px}
}

/* New tag animation */
.new-tag{background:var(--accent2);color:#fff;font-size:10px;padding:1px 5px;border-radius:3px;margin-left:4px;animation:pulse-new 2s infinite}
@keyframes pulse-new{0%,100%{opacity:1}50%{opacity:.5}}
</style>
</head>

var currentFilter = 'all';
var searchKw = '';

function getBadgeClass(type){
  switch(type){
    case '中标公示': return 'badge-zb';
    case '中标候选人': return 'badge-zbgs';
    case '招标公告': return 'badge-zbtg';
    case '流标': return 'badge-lb';
    case '磋商/询价': return 'badge-cs';
    case '合同备案': return 'badge-ht';
    case '变更公告': return 'badge-bg';
    default: return '';
  }
}
function getCategoryLabel(c){
  switch(c){
    case 'gc': return '工程';
    case 'zf': return '政采';
    case 'qt': return '其他';
    default: return '';
  }
}
function getCategoryClass(c){
  switch(c){
    case 'gc': return 'gc';
    case 'zf': return 'zf';
    case 'qt': return 'qt';
    default: return '';
  }
}

function render(){
  var filtered = DATA.filter(function(d){
    if(currentFilter !== 'all'){
      if(d.type !== currentFilter) return false;
    }
    if(searchKw){
      var kw = searchKw.toLowerCase();
      if(d.name.toLowerCase().indexOf(kw) < 0 && d.owner.toLowerCase().indexOf(kw) < 0 && (d.winner||'').toLowerCase().indexOf(kw) < 0) return false;
    }
    return true;
  });

  // Update stats based on all data
  var zb = DATA.filter(function(d){return d.type==='中标公示'}).length;
  var zbgs = DATA.filter(function(d){return d.type==='中标候选人'}).length;
  var zbtg = DATA.filter(function(d){return d.type==='招标公告'}).length;
  var lb = DATA.filter(function(d){return d.type==='流标'}).length;
  var bg = DATA.filter(function(d){return d.type==='变更公告'}).length;
  var ht = DATA.filter(function(d){return d.type==='合同备案'}).length;
  var cs = DATA.filter(function(d){return d.type==='磋商/询价'}).length;
  document.getElementById('s-total').textContent = DATA.length;
  document.getElementById('s-zb').textContent = zb;
  document.getElementById('s-zbgs').textContent = zbgs;
  document.getElementById('s-zbtg').textContent = zbtg;
  document.getElementById('s-ht').textContent = ht;
  document.getElementById('s-cs').textContent = cs;
  document.getElementById('s-lb').textContent = lb + bg;

  var html = '';
  for(var i = 0; i < filtered.length; i++){
    var d = filtered[i];
    var isNew = (d.date >= '2026-08-10');
    html += '<tr onclick="toggleDetail('+i+')">';
    html += '<td>'+(i+1)+'</td>';
    html += '<td><span class="project-name">'+escHtml(d.name)+'</span>'+(isNew?'<span class="new-tag">NEW</span>':'')+'</td>';
    html += '<td><span class="badge '+getBadgeClass(d.type)+'">'+escHtml(d.type)+'</span> <span class="tag-type '+getCategoryClass(d.category)+'">'+getCategoryLabel(d.category)+'</span></td>';
    html += '<td>'+escHtml(d.owner)+'</td>';
    html += '<td>'+(d.winner && d.winner !== '--' && d.winner !== '待定' ? escHtml(d.winner) : '<span style="color:var(--text-light)">--</span>')+'</td>';
    html += '<td style="white-space:nowrap">'+escHtml(d.amount)+'</td>';
    html += '<td style="white-space:nowrap">'+d.date.slice(5)+'</td>';
    html += '</tr>';
    html += '<tr class="detail-row" id="detail-'+i+'"><td colspan="7" class="detail-cell"><div class="detail-content">';
    html += '<strong>项目名称：</strong>'+escHtml(d.name)+'<br>';
    html += '<strong>发布日期：</strong>'+d.date+'<br>';
    if(d.detail) html += '<strong>详情：</strong>'+escHtml(d.detail)+'<br>';
    if(d.url) html += '<a href="'+d.url+'" target="_blank">查看原文 &rarr;</a>';
    html += '</div></td></tr>';
  }
  if(!filtered.length){
    html = '<tr><td colspan="7" style="text-align:center;padding:40px;color:var(--text-light)">暂无匹配数据</td></tr>';
  }
  document.getElementById('tbody').innerHTML = html;
}

function toggleDetail(idx){
  var row = document.getElementById('detail-'+idx);
  if(row){
    row.classList.toggle('open');
  }
}

function escHtml(s){
  if(!s) return '';
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// Bind filter buttons
document.querySelectorAll('.filter-btn').forEach(function(btn){
  btn.addEventListener('click', function(){
    document.querySelectorAll('.filter-btn').forEach(function(b){b.classList.remove('active')});
    this.classList.add('active');
    currentFilter = this.getAttribute('data-filter');
    render();
  });
});

// Bind search
document.getElementById('search').addEventListener('input', function(){
  searchKw = this.value.trim();
  render();
});

// Initial render
render();
</script>
