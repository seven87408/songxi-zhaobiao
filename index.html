<html lang="zh-CN">
<head>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:linear-gradient(135deg,#e8f0fe 0%,#f0f4ff 50%,#e6eef8 100%);min-height:100vh;color:#1a2a3a}
.header{background:linear-gradient(135deg,#0d2137 0%,#1a3a5c 40%,#2563eb 100%);color:#fff;padding:28px 0 22px;text-align:center;position:relative;overflow:hidden}
.header::before{content:'';position:absolute;top:-60%;left:-10%;width:120%;height:200%;background:radial-gradient(ellipse at 30% 50%,rgba(59,130,246,0.18) 0%,transparent 60%);pointer-events:none}
.header h1{font-size:26px;font-weight:700;letter-spacing:2px;position:relative}
.header .sub{font-size:13px;color:rgba(255,255,255,0.75);margin-top:6px;position:relative}
.container{max-width:1200px;margin:0 auto;padding:18px 16px 40px}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:22px}
.stat-card{background:#fff;border-radius:12px;padding:18px 14px;text-align:center;cursor:pointer;transition:all .25s;border:1px solid #e2e8f0;position:relative;overflow:hidden}
.stat-card:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(37,99,235,0.13)}
.stat-card.active{border-color:#2563eb;background:linear-gradient(135deg,#eff6ff,#dbeafe)}
.stat-card .num{font-size:30px;font-weight:800;line-height:1.1}
.stat-card .label{font-size:12px;color:#64748b;margin-top:4px;font-weight:500}
.stat-card .icon{font-size:18px;margin-bottom:4px}
.stat-card:nth-child(1) .num{color:#1e40af}
.stat-card:nth-child(2) .num{color:#d97706}
.stat-card:nth-child(3) .num{color:#059669}
.stat-card:nth-child(4) .num{color:#7c3aed}
.stat-card:nth-child(5) .num{color:#64748b}
.tabs{display:flex;gap:0;margin-bottom:0;border-bottom:2px solid #e2e8f0}
.tab-btn{padding:10px 28px;font-size:14px;font-weight:600;cursor:pointer;border:none;background:transparent;color:#64748b;border-bottom:3px solid transparent;margin-bottom:-2px;transition:all .2s}
.tab-btn:hover{color:#1e40af}
.tab-btn.active{color:#1e40af;border-bottom-color:#2563eb}
.sub-tabs{display:flex;gap:0;margin-bottom:16px;margin-top:14px;flex-wrap:wrap}
.sub-btn{padding:6px 16px;font-size:12px;font-weight:500;cursor:pointer;border:1px solid #e2e8f0;background:#fff;color:#475569;border-radius:20px;margin-right:6px;margin-bottom:6px;transition:all .2s}
.sub-btn:hover{border-color:#2563eb;color:#1e40af}
.sub-btn.active{background:#1e40af;color:#fff;border-color:#1e40af}
.tab-content{display:none}
.tab-content.active{display:block}
.platform-card{background:#fff;border-radius:12px;margin-bottom:16px;border:1px solid #e2e8f0;overflow:hidden;transition:box-shadow .2s}
.platform-card:hover{box-shadow:0 4px 16px rgba(0,0,0,0.06)}
.platform-header{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;cursor:pointer;user-select:none}
.platform-name{font-size:15px;font-weight:700;color:#1e40af;display:flex;align-items:center;gap:8px}
.platform-count{font-size:12px;color:#94a3b8;background:#f1f5f9;padding:2px 10px;border-radius:10px;font-weight:600}
.platform-arrow{font-size:12px;color:#94a3b8;transition:transform .25s}
.platform-card.open .platform-arrow{transform:rotate(180deg)}
.platform-body{display:none;padding:0 20px 16px}
.platform-card.open .platform-body{display:block}
.data-table{width:100%;border-collapse:collapse;font-size:13px}
.data-table th{background:#f8fafc;color:#475569;font-weight:600;text-align:left;padding:10px 12px;border-bottom:2px solid #e2e8f0;font-size:12px;white-space:nowrap}
.data-table td{padding:10px 12px;border-bottom:1px solid #f1f5f9;vertical-align:top;line-height:1.6}
.data-table tr:hover td{background:#f8fafc}
.data-table .idx{color:#94a3b8;font-weight:600;width:36px;text-align:center}
.project-name{color:#1e3a5f;font-weight:600;max-width:420px}
.project-name a{color:#1e40af;text-decoration:none;transition:color .15s}
.project-name a:hover{color:#2563eb;text-decoration:underline}
.tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;white-space:nowrap}
.tag-zb{background:#fef3c7;color:#92400e}
.tag-zb2{background:#d1fae5;color:#065f46}
.tag-ht{background:#ede9fe;color:#5b21b6}
.tag-other{background:#f1f5f9;color:#475569}
.tag-cgyx{background:#fce7f3;color:#9d174d}
.date-cell{color:#64748b;white-space:nowrap;font-weight:500}
.footer{text-align:center;padding:20px;color:#94a3b8;font-size:12px;border-top:1px solid #e2e8f0;margin-top:30px}
.footer a{color:#64748b;text-decoration:none}
.empty-state{text-align:center;padding:40px 20px;color:#94a3b8;font-size:14px}
@media(max-width:768px){
.stats{grid-template-columns:repeat(3,1fr);gap:10px}
.stat-card .num{font-size:24px}
.container{padding:12px 10px 30px}
.header h1{font-size:20px}
}
</style>
</head>

{date:"2026-08-10",name:"2026年松溪县农村供水保障工程—茶平乡施工投标邀请书",category:"招标公告",source:"福建省政府采购网",url:"https://ggzy.np.gov.cn/sx/qyzbxx/013003/20260810/7e3a16cd-2a84-4b0a-9947-fb7a4a836fd1.html",week:"lastweek"},

var platformMap={
"福建省政府采购网":"福建省政府采购网 (ggzy.np.gov.cn)",
"中国政府采购网":"中国政府采购网 (ccgp.gov.cn)",
"千里马招标网":"千里马招标网 (qianlima.com)",
"中国招标网":"中国招标网 (chinabidding.cn)",
"工采通":"工采通 (gongcaitong.cn)",
"中国招标投标公共服务平台":"中国招标投标公共服务平台 (cebpubservice.com)"
};
var currentTab='all';
var currentCategory={all:'all',thisweek:'all',lastweek:'all'};
function getTagClass(cat){
if(cat==='招标公告')return'tag tag-zb';
if(cat==='中标结果')return'tag tag-zb2';
if(cat==='合同备案')return'tag tag-ht';
if(cat==='采购意向')return'tag tag-cgyx';
return'tag tag-other';
}
function getFilteredData(week,category){
var items=allData;
if(week!=='all')items=items.filter(function(d){return d.week===week});
if(category&&category!=='all')items=items.filter(function(d){return d.category===category});
return items;
}
function renderData(containerId,items){
var container=document.getElementById(containerId);
if(!items.length){container.innerHTML='<div class="empty-state">暂无数据</div>';return;}
var platforms={};
items.forEach(function(item){var pk=item.source;if(!platforms[pk])platforms[pk]=[];platforms[pk].push(item);});
var html='';
var pKeys=Object.keys(platforms).sort(function(a,b){return platforms[b].length-platforms[a].length});
pKeys.forEach(function(pk){
var pItems=platforms[pk];
var pLabel=platformMap[pk]||pk;
var cardId=containerId+'-'+pk.replace(/[^a-zA-Z0-9]/g,'x');
html+='<div class="platform-card open" id="'+cardId+'">';
html+='<div class="platform-header" onclick="toggleCard(\''+cardId+'\')">';
html+='<span class="platform-name">'+pLabel+'</span>';
html+='<span class="platform-count">'+pItems.length+'条</span>';
html+='<span class="platform-arrow">&#9660;</span>';
html+='</div>';
html+='<div class="platform-body">';
html+='<table class="data-table"><thead><tr><th>序号</th><th>日期</th><th>项目名称</th><th>类型</th></tr></thead><tbody>';
pItems.forEach(function(item,i){
html+='<tr>';
html+='<td class="idx">'+(i+1)+'</td>';
html+='<td class="date-cell">'+item.date+'</td>';
html+='<td class="project-name"><a href="'+item.url+'" target="_blank" rel="noopener">'+item.name+'</a></td>';
html+='<td><span class="'+getTagClass(item.category)+'">'+item.category+'</span></td>';
html+='</tr>';
});
html+='</tbody></table></div></div>';
});
container.innerHTML=html;
}
function switchTab(tab){
currentTab=tab;
document.querySelectorAll('.tab-btn').forEach(function(b){b.classList.remove('active')});
document.querySelectorAll('.tab-content').forEach(function(c){c.classList.remove('active')});
document.getElementById('tab-'+tab).classList.add('active');
event.target.classList.add('active');
var cat=currentCategory[tab]||'all';
refreshView(tab,cat);
}
function filterSub(tab,category){
currentCategory[tab]=category;
var subTabs=document.querySelectorAll('#subtabs-'+tab+' .sub-btn');
subTabs.forEach(function(b){b.classList.remove('active')});
event.target.classList.add('active');
refreshView(tab,category);
}
function filterByCategory(cat){
switchTab('all');
currentCategory['all']=cat;
var subTabs=document.querySelectorAll('#subtabs-all .sub-btn');
subTabs.forEach(function(b){
b.classList.remove('active');
if((cat==='all'&&b.textContent==='全部项目')||b.textContent===cat)b.classList.add('active');
});
refreshView('all',cat);
}
function refreshView(tab,category){
var items=getFilteredData(tab==='all'?'all':tab,category);
renderData('data-'+tab,items);
}
function toggleCard(id){
var card=document.getElementById(id);
if(card)card.classList.toggle('open');
}
refreshView('all','all');
refreshView('thisweek','all');
refreshView('lastweek','all');
</script>

</html>
